name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify source, tests and coverage
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-home

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-jacoco
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14