name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache project Maven repository
        uses: actions/cache@v6
        with:
          path: .cache/maven/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Verify source, tests and coverage
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-home

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-jacoco
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  mysql-integration:
    name: MySQL 8 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resort
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache project Maven repository
        uses: actions/cache@v6
        with:
          path: .cache/maven/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Verify real MySQL migrations and persistence wiring
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -Dtest=MySqlLiveIntegrationTest test
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-home
          MYSQL_URL: jdbc:mysql://127.0.0.1:3306/resort?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: root
