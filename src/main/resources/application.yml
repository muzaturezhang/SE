spring:
  application:
    name: holiday-resort-booking
  profiles:
    default: dev
  thymeleaf:
    encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: Asia/Shanghai
  currency: CNY
  booking-hold-minutes: ${BOOKING_HOLD_MINUTES:15}
  membership:
    fee-minor: ${MEMBERSHIP_FEE_MINOR:68000}
    discount-percent: ${MEMBERSHIP_DISCOUNT_PERCENT:5}
    duration-days: ${MEMBERSHIP_DURATION_DAYS:365}

booking:
  expiry-enabled: ${BOOKING_EXPIRY_ENABLED:false}
  expiry-interval-ms: ${BOOKING_EXPIRY_INTERVAL_MS:60000}

notification:
  dispatch-enabled: false
  batch-size: 50
  max-attempts: 3
  retry-delay: 15m
  send-lease: 5m
  dispatch-interval-ms: 60000
  send-hour: ${NOTIFICATION_SEND_HOUR:9}
  from-address: ${NOTIFICATION_FROM_ADDRESS:no-reply@example.invalid}
